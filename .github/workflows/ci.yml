# =============================================================================
#  CI — clean-checkout build + headless test (Horizon 0, strategy priority #5)
# =============================================================================
#  Reproduces the baseline on a fresh machine so a "it builds and tests pass"
#  claim does not depend on the maintainer's laptop. The test_* targets are
#  dependency-free and headless (no window/display), so ctest runs on CI as-is;
#  building `demo` links SDL2 but does not need a display.
#
#  "The Drogon-guarded `baas` target is skipped automatically when Drogon is
#  absent" used to be the end of that sentence, and it hid a number: skipping it
#  skipped 28 of the 76 tests — every one about auth, tokens, purchases, cloud
#  saves and the three that boot a real server. The `baas-test` job below installs
#  Drogon instead of routing around it (chapter 129).
#
#  Authored 2026-07-11. The two newest jobs (`web-build`'s page check and
#  `baas-test`) were RUN before they were pushed — the web one against a local
#  Chrome, the BaaS one inside this very image. The older steps were not; that
#  note used to cover the whole file and now covers only them.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Golden-path smoke (headless inspect)
        run: ./build/demo --project-inspect projects/creator.gameproject

      - name: The CLI flag is an alias, not a second formatter
        run: |
          # --project-inspect and --cmd project.inspect must produce the IDENTICAL
          # text, because there is one function producing it (chapter 114). The day
          # someone prints "just this one extra thing" in main.cpp, this breaks.
          ./build/demo --project-inspect projects/creator.gameproject > /tmp/flag.txt
          ./build/demo --cmd project.inspect projects/creator.gameproject > /tmp/cmd.txt
          diff /tmp/flag.txt /tmp/cmd.txt
          # ...and a project with missing content reports EVERY problem, not the first.
          printf 'gameproject1\nname Probe\nschema 1\nentry fps\nasset text a.txt\nasset text b.txt\nasset text c.txt\n' \
            > assets/projects/_ci_probe.gameproject
          ./build/demo --project-publish projects/_ci_probe.gameproject development ci 2>&1 \
            | tee /tmp/pub.txt || true
          grep -q 'a.txt' /tmp/pub.txt && grep -q 'b.txt' /tmp/pub.txt && grep -q 'c.txt' /tmp/pub.txt
          rm -f assets/projects/_ci_probe.gameproject

      - name: Second-game smoke (the spine accepts a game it was not written for)
        run: |
          # The farm arrived as a manifest + an entry id and nothing in the spine
          # changed to accept it. That is the claim; this is where it stops being an
          # assertion in a chapter and becomes something CI can break.
          ./build/demo --project-inspect projects/farm.gameproject
          ./build/demo --project-package projects/farm.gameproject | grep -q '^packagehash '
          ./build/demo --hub projects/farm.gameproject

      - name: Cross-toolchain determinism (re-play a battle recorded on another machine)
        run: |
          # assets/creatures/reference.crep was written by macOS/arm64/clang. This job
          # is Linux/x86_64/gcc on one runner and macOS on the other, and both re-play
          # it and check the hash after EVERY turn. Until chapter 138 the sim's
          # determinism was only ever checked inside one process, which proves it is a
          # pure function and says nothing about two toolchains agreeing on the result.
          ./build/demo --cmd creature.verify creatures/reference.crep
          # A verifier that answered OK to everything would pass that line, so it is
          # also pointed at a file that must FAIL. One flipped hex digit in one turn
          # hash: same rules, different arithmetic — the exact shape of the bug this
          # whole format exists to catch.
          sed '12s/^t \(.*\)0$/t \11/; 12s/^t \(.*\)[1-9a-f]$/t \10/' \
            assets/creatures/reference.crep > assets/creatures/ci_tampered.crep
          ! cmp -s assets/creatures/reference.crep assets/creatures/ci_tampered.crep
          if ./build/demo --cmd creature.verify creatures/ci_tampered.crep; then
            echo "the verifier accepted a tampered replay"; exit 1
          fi
          rm assets/creatures/ci_tampered.crep
          # The BYTES are checked by `ctest -R creature`, which re-bakes the reference
          # on this machine and compares it to the committed file — the same standard
          # a .recipe is held to, and the stronger of the two claims.

      - name: Create-verb smoke (scaffold → inspect the scaffold)
        run: |
          # Every verb takes paths relative to the ASSET ROOT (assets/), never to the
          # working directory — so this writes assets/ci_new.gameproject, which is what
          # .gitignore's `assets/ci_*.gameproject` was always meant to match. The extra
          # `assets/` prefix this line used to carry made it write
          # assets/assets/ci_new.gameproject, and the inspect below then failed.
          ./build/demo --project-new ci_new.gameproject fps "CI New"
          ./build/demo --project-inspect ci_new.gameproject   # scaffolded manifest must inspect OK

      - name: Release-store smoke (publish → verify → promote dev→preview→prod → audit)
        run: |
          ./build/demo --project-publish projects/creator.gameproject development "ci"
          ./build/demo --project-publish projects/creator.gameproject development "ci"  # idempotent: verified no-op
          ./build/demo --project-verify projects/creator.gameproject development         # preview parity (P2): must exit 0
          ./build/demo --release-promote development preview "ci promote"
          ./build/demo --release-promote preview production "ci ship"
          ./build/demo --release-status
          ./build/demo --release-log         # append-only audit history
          ./build/demo --hub projects/creator.gameproject   # aggregate status + next recommended action
          test "$(find assets/releases assets/channels -name '*.tmp' | wc -l)" -eq 0  # atomic writes leave no .tmp

      - name: Command-registry smoke (the CLI verbs are aliases onto it)
        run: |
          ./build/demo --cmd release.status                       # same data --release-status prints
          ./build/demo --cmd release.log production
          # A mutating operation with no reason must be REFUSED. The audit log is only
          # worth keeping if every line in it explains something, so this is a
          # behaviour guarantee, not a nicety.
          if ./build/demo --project-publish projects/creator.gameproject; then
            echo "publish without a reason was accepted — it must not be" >&2
            exit 1
          fi
          if ./build/demo --cmd release.promote development preview ""; then
            echo "promote with an empty reason was accepted — it must not be" >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  #  Web build — the gate that used to be "it links"
  # ---------------------------------------------------------------------------
  #  Every earlier slice reported "web build green", and that only ever meant the
  #  Emscripten link succeeded. It had never RUN: the first time the page was
  #  opened it died at SDL_CreateRenderer, and the bundle turned out to be
  #  shipping the developer's own saves/ and releases/ (chapter 118).
  #
  #  Linking is still worth gating. What is added here is the check that costs
  #  nothing and would have caught the leak: the preload manifest inside demo.js
  #  must not name a file from a directory that is gitignored as local state.
  #
  #  The build steps were written blind in 2026-07-11; the page check below was
  #  run locally against Chrome before it was pushed (chapter 128).
  web-build:
    name: web build (emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: Configure + build (wasm)
        run: |
          emcmake cmake -B build-web
          cmake --build build-web --target demo -j

      - name: The bundle must not contain this machine's state
        run: |
          # demo.js carries the preload manifest as filename:"..." entries.
          if grep -oE 'filename:"[^"]+"' build-web/demo.js \
             | grep -E '/(saves|releases|channels)/'; then
            echo "::error::the web bundle preloads local state (see the lines above)"
            exit 1
          fi
          echo "preloaded entries: $(grep -oc 'filename:"' build-web/demo.js || true)"

      # -----------------------------------------------------------------------
      #  ...and now it RUNS. Building proves the link; this proves the page.
      #
      #  The farm has been "playable by hand" since chapter 126 and it ships on a
      #  browser page that had never been driven by a finger. So: a real
      #  Input.dispatchTouchEvent on a 390x844 viewport, aimed at the button the
      #  game itself printed, checked by reading the player's tile back out of the
      #  save the game wrote. Not a screenshot — a value.
      # -----------------------------------------------------------------------
      - name: The page runs, and a finger can drive it
        run: |
          # ubuntu-latest ships Google Chrome; say so out loud, because a missing
          # browser and a broken page fail in the same place otherwise.
          which google-chrome || which chromium-browser || which chromium
          google-chrome --version || true
          node --version
          node scripts/web_touch_check.mjs --dir build-web --game farm
          # ...and the second game, which is NOT the same check with a different
          # manifest. The farm is proved by holding east and pressing Save; walking
          # east in the creature game puts you in a fight, where there IS no save
          # button — so that run drives the whole loop instead: into the grass, out
          # of the battle, acknowledged, then saved. Two games, two shapes, one
          # script, because both games print where their buttons are.
          node scripts/web_touch_check.mjs --dir build-web --game creatures
          # A THIRD toolchain agrees about the arithmetic. `build-test` already
          # re-plays assets/creatures/reference.crep on x86-64/gcc and on
          # arm64/clang; this runs the same verify inside the WebAssembly build,
          # which is the target this project actually ships on and the one whose
          # compiler nothing else here has ever asked to compute anything twice.
          node scripts/web_touch_check.mjs --dir build-web \
            --cmd creature.verify --args creatures/reference.crep --expect OK

      # -----------------------------------------------------------------------
      #  The other half of "one link": a page that lists what there is, and a Play
      #  button that LANDS somewhere. A correct href is not a working link —
      #  chapter 123's keyboard was wired to a canvas nobody had focused, and every
      #  check that stopped one step short of the end passed. So this one taps Play
      #  and waits for the game to say "running".
      # -----------------------------------------------------------------------
      - name: The collection page lists the games, and Play reaches one
        run: node scripts/web_collection_check.mjs --dir build-web

  # ---------------------------------------------------------------------------
  #  BaaS — the half of the suite that had never run anywhere but a laptop
  # ---------------------------------------------------------------------------
  #  `ctest` on this machine reports 76 tests. The job above reports 48. The 28 in
  #  between are the Drogon-gated ones — auth, JWT, leaderboard, cloud save,
  #  inventory, purchases, RBAC, live ops, replays, tracing, and the three
  #  end-to-end runs that boot a real server and drive it with the real SDK — and
  #  they were dark in CI from the day they were written, because the runner only
  #  ever installed SDL2.
  #
  #  The recipe is not new: baas/ops/Dockerfile has built this exact thing since
  #  chapter 107 (`-DENGINE_BUILD_DESKTOP=OFF`, so no SDL2 is needed and the
  #  backend image can exist at all). This job is that Dockerfile's build stage,
  #  stopping at the tests instead of the binary.
  #
  #  Verified by running it: the same image, the same steps, on this branch.
  baas-test:
    name: baas tests (drogon)
    runs-on: ubuntu-latest
    container: drogonframework/drogon:latest
    # A REAL Postgres, since chapter 141. The suite's default backend is SQLite, whose
    # pool is one connection — which makes every read-then-write in the codebase look
    # atomic whether or not it is, and made "Postgres is a documented deploy-time build"
    # survive as a sentence for eleven slices. It is a sentence no longer: the same
    # tests run twice below, once against each backend, and the second run is the only
    # one where the row locks of chapter 140 mean anything.
    #
    # The job runs IN a container, so this service is reachable by its label on the
    # same network — no port mapping, no localhost.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: baas
          POSTGRES_PASSWORD: baas
          POSTGRES_DB: baas
        options: >-
          --health-cmd "pg_isready -U baas -d baas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: What the Drogon image does not carry
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libsodium-dev libcurl4-openssl-dev pkg-config
          cmake --version

      - name: Configure, and SAY what this environment cannot build
        run: |
          set -o pipefail
          cmake -B build-baas -DCMAKE_BUILD_TYPE=Release -DENGINE_BUILD_DESKTOP=OFF \
            2>&1 | tee /tmp/configure.log
          echo "--- skipped in this environment ---"
          grep -iE 'SKIPPING|stub' /tmp/configure.log || echo "(nothing skipped)"

      - name: Build the Drogon-gated half
        run: |
          # `baas_tests` is every target baas/CMakeLists.txt defines, so this job
          # does not rebuild the 48 the job above already ran — and does not carry
          # a list of target names that would go stale.
          cmake --build build-baas --target baas_tests -j"$(nproc)"

      - name: Run them
        # --test-dir <build>/baas selects exactly the tests that directory registers.
        run: ctest --test-dir build-baas/baas --output-on-failure

      # -----------------------------------------------------------------------
      #  ...and now the SAME tests, against the other backend.
      #
      #  Not a different suite and not a subset: BAAS_TEST_DB points every test at
      #  Postgres and each one wipes the schema on the way in. Two runs of one suite is
      #  the only shape that can catch what this slice is about — a query that parses in
      #  SQLite and not in Postgres passes the run above and fails this one, in the test
      #  that already covers the feature. Nobody has to remember to write it twice.
      #
      #  It is also where `test_baas_concurrency` finally has teeth: eight threads on one
      #  purse says nothing on a pool of one, and its own header says so.
      # -----------------------------------------------------------------------
      - name: ...and again, against a real Postgres
        env:
          BAAS_TEST_DB: postgres://baas:baas@postgres:5432/baas
        run: ctest --test-dir build-baas/baas --output-on-failure

      - name: ...and there really were 27 of the 29
        run: |
          n=$(ctest --test-dir build-baas/baas -N | grep -cE 'Test +#')
          echo "registered baas tests: $n"
          # A green job that ran nothing is the failure mode this whole slice is
          # about. Assert a floor, not an exact count: adding a test must not break
          # CI, losing the directory must.
          #
          # 27, not 29: `sdk_realtime_live` and `creature_pvp_live` both need libcurl
          # >= 7.86 for the WebSocket API, and this image is Ubuntu 22.04 with 7.81.
          # The configure output above names both. They still only run on a machine
          # with a modern curl — see chapters 129 and 139; it is a ceiling, not an
          # oversight, and it is now TWO tests wide rather than one, which is a cost
          # worth stating rather than a number worth quietly editing.
          [ "$n" -ge 27 ] || { echo "::error::only $n baas tests were registered"; exit 1; }

  # ---------------------------------------------------------------------------
  #  The backend IMAGE — built, started, and asked a question
  # ---------------------------------------------------------------------------
  #  `baas/ops/Dockerfile` has existed since chapter 107 and PROJECT-BRIEF has
  #  carried "❌ never verified" beside it ever since: the base image is amd64 and
  #  building it under emulation on a laptop was outside the time budget. A CI
  #  runner is amd64, so the cost is a job, not an afternoon.
  #
  #  It found the thing that line was pointing at. The CMD ended in `--seed`, and
  #  `--seed` printed the demo key and RETURNED 0 — so the container seeded and
  #  exited, every time, and `restart: unless-stopped` in docker-compose turned that
  #  into a loop that never listened. The image had never answered a request. Since
  #  chapter 142 `--seed` seeds and then serves, and `--seed-only` is the one-shot.
  #
  #  So this job asserts the three things in order: the image builds, the container
  #  is STILL RUNNING a moment later, and it answers.
  baas-docker:
    name: backend image answers /healthz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f baas/ops/Dockerfile -t hand-baas .

      - name: Start it
        run: |
          docker run -d --name baas -p 8080:8080 \
            -e BAAS_JWT_SECRET=ci-not-a-real-secret \
            -e BAAS_ADMIN_SECRET=ci-not-a-real-secret \
            hand-baas
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # The bug this job exists for does not look like a failed request, it looks
          # like a container that is not there. Say which one happened.
          running=$(docker inspect -f '{{.State.Running}}' baas)
          echo "running: $running"
          if [ "$running" != "true" ]; then
            echo "::error::the container exited instead of serving"
            docker logs baas
            exit 1
          fi

      - name: ...and it answers
        run: |
          set -o pipefail
          curl -fsS http://127.0.0.1:8080/healthz | tee /dev/stderr | grep -q '"status":"ok"'

          # The API is really up, not just the process: sign in as a guest against the
          # project the CMD's `--seed` created, and require a token back. That single
          # request proves the seed ran, the database is writable inside the container,
          # the api-key filter resolved a project, and JWT signing works.
          tok=$(curl -fsS -X POST http://127.0.0.1:8080/v1/auth/guest \
                  -H 'X-Api-Key: pk_demo_colony' -H 'Content-Type: application/json' \
                  -d '{"display_name":"ci"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          test -n "$tok" && echo "guest signed in, token length ${#tok}"

      - name: The document it serves is the document in the repo
        run: |
          # /openapi.json is generated from the same table `test_baas_openapi` compares
          # to Drogon's route list. This closes the last gap between the two: the file
          # committed here and the file a caller actually downloads.
          curl -fsS http://127.0.0.1:8080/openapi.json > /tmp/served.json
          python3 - <<'PY'
          import json
          a = json.load(open('/tmp/served.json'))
          b = json.load(open('baas/openapi.json'))
          assert a == b, "the served OpenAPI document differs from baas/openapi.json"
          ops = sum(len(v) for v in a['paths'].values())
          print(f"{len(a['paths'])} paths, {ops} operations, identical")
          PY

      - name: What it logged
        if: always()
        run: docker logs baas 2>&1 | tail -40

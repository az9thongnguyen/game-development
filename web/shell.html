<!doctype html>
<!-- =========================================================================
     web/shell.html  —  the page Emscripten wraps the WASM build in
     ----------------------------------------------------------------------- -->
<!-- emcc substitutes {{{ SCRIPT }}} with the loader for demo.js/demo.wasm. The
     ONLY app-specific thing here is `Module.arguments`, which become argv[1..]
     in our unchanged main.cpp — that is how the web build picks which scene to
     run WITHOUT a recompile or any engine/game change:
       ?mode=gui (chess) | ?project=<manifest> | ?shell=<manifest> (the Studio)
       | ?mode=lab-<id> | (none = chess)

     Chapter 128 turned this from a debug page into the page the games ship on.
     What the page must do, and did not: fill the screen, keep the game's SHAPE,
     and let a finger through.

       fit()                the load-bearing one. See its comment — Emscripten sets
                            inline width/height styles, and after that the two axes
                            clamp independently and the picture stretches.
       touch-action: none   declared intent. A held finger DOES reach the game
                            without it, and the automated check cannot say more
                            than that: CDP's synthetic touch ignores touch-action
                            entirely (measured — a drag scrolled a scrollable page
                            by the same 110 px with `none` and with `auto`). It
                            stays for pinch-zoom, double-tap-zoom, and the day this
                            layout starts to scroll.
       overscroll-behavior  no pull-to-refresh in the middle of walking east.
       user-select: none    a long press is a button hold, not a text selection.

     What is NOT here, deliberately: integer scaling. The farm's canvas is
     1280x720 and a phone is 390 CSS px wide, so an integer scale would need a
     phone four times wider than any phone. Fitting the stage while keeping the
     ratio is the constraint that actually matters.
     ========================================================================= -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + the safe-area insets below: on a notched phone the game
       may use the full screen, and the padding keeps the d-pad off the home bar. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1020">
  <title>Hand Engine — player</title>
  <!-- Inline, so the page does not 404 on /favicon.ico. A 404 in the console of a
       page whose whole job is to prove the build works is noise that hides signal. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%237c9cff'/><path d='M5 4l7 4-7 4z' fill='%230b1020'/></svg>">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020; --surface: #131b2d; --raised: #19243a;
      --line: #263550; --line-strong: #405477;
      --text: #f2f5fc; --dim: #adb8ce; --muted: #71809b;
      --accent: #7c9cff; --success: #45d39a;
    }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--dim);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      /* No pull-to-refresh, no rubber-banding: both of them end a drag that the
         game was in the middle of reading. */
      overscroll-behavior: none;
    }
    body {
      display: flex; flex-direction: column;
      /* dvh, not vh: on a phone `100vh` is the height with the URL bar HIDDEN, so a
         vh-sized page is taller than the screen until the user scrolls — and this
         page must not scroll. */
      height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    #bar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
      padding: 7px 8px; min-height: 58px;
      border-bottom: 1px solid var(--line); background: rgba(19, 27, 45, .96);
      box-shadow: 0 10px 35px rgba(0,0,0,.24);
    }
    #backlink, button {
      flex: 0 0 44px; width: 44px; min-height: 44px; padding: 0;
      display: inline-grid; place-items: center; border: 1px solid var(--line-strong);
      border-radius: 10px; background: transparent; color: var(--text);
      font: inherit; font-size: 19px; text-decoration: none; cursor: pointer;
    }
    #backlink:hover, button:hover { background: var(--raised); }
    #backlink:focus-visible, button:focus-visible {
      outline: 3px solid rgba(162,184,255,.55); outline-offset: 1px;
    }
    .game-id { min-width: 0; display: flex; flex-direction: column; line-height: 1.1; }
    .product { color: var(--muted); font-size: 9px; font-weight: 800;
               letter-spacing: .14em; text-transform: uppercase; }
    #title { color: var(--text); font-size: 14px; font-weight: 750; white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; }
    #status.status-pill {
      flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      color: var(--success); background: rgba(69,211,154,.08);
      border: 1px solid rgba(69,211,154,.24); border-radius: 999px;
      padding: 5px 8px; font-size: 10px; font-weight: 750;
      letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
    }
    #hint { color: #e6be5b; font-size: 11px; white-space: nowrap; }
    .spacer { flex: 1 1 auto; }
    #stage {
      flex: 1 1 auto; min-height: 0;
      display: grid; place-items: center;
      /* The stage, not the canvas, is what goes fullscreen: fullscreening the canvas
         makes the browser stretch it to the screen's aspect ratio. */
      background: radial-gradient(circle at 50% 35%, #151f35 0, #080c17 70%);
    }
    canvas {
      display: block; background: #000;
      /* Sized in JS by fit(), NOT by these — see the comment there. They remain as the
         floor: before the first fit, and if the script ever fails, the canvas is still
         inside the stage rather than pushing the page open. */
      max-width: 100%; max-height: 100%;
      /* Declared intent; see the top of this file for what is and is not proved. */
      touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      outline: none;
    }
    #log {
      flex: 0 0 auto; display: none;
      white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace;
      font-size: 11px; color: var(--muted); background: #080c17;
      max-height: 28vh; overflow: auto; padding: 6px 10px;
      border-top: 1px solid #1e2330;
    }
    body.logging #log { display: block; }
    /* In fullscreen the page chrome is not chrome, it is a strip of wasted screen. */
    #stage:fullscreen { background: #000; }
    body:fullscreen #bar, body:fullscreen #log { display: none; }
    @media (max-width: 560px) {
      #bar { gap: 6px; }
      #hint, .product { display: none; }
      #status.status-pill { max-width: 72px; }
    }
  </style>
</head>
<body>
  <nav id="bar" aria-label="Player controls">
    <a id="backlink" href="collection.html" aria-label="Back to collection" title="Back to collection">←</a>
    <span class="game-id"><span class="product">Hand Engine</span><span id="title">Player</span></span>
    <span id="status" class="status-pill" role="status">loading</span>
    <span id="hint"></span>
    <span class="spacer"></span>
    <button id="logbtn" type="button" title="Show runtime log" aria-label="Show runtime log">≡</button>
    <button id="fsbtn" type="button" title="Enter fullscreen" aria-label="Enter fullscreen">⛶</button>
  </nav>
  <div id="stage">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  </div>
  <div id="log"></div>
  <script>
    var statusEl = document.getElementById('status');
    var logEl    = document.getElementById('log');
    var titleEl  = document.getElementById('title');
    var stageEl  = document.getElementById('stage');
    var canvasEl = document.getElementById('canvas');
    var hintEl   = document.getElementById('hint');

    // Pick the scene from ?mode=… so one WASM build can run any demo without a
    // recompile (default: chess, the M5 acceptance scene).
    var argsByMode = {
      gui:    ['--gui', 'hvai', 'medium'],
      fps:    ['--fps'],
      // Golden path: launch the reference game from a game.project manifest — the same
      // named project the native build runs, so web/native pick the scene identically.
      project: ['--project', 'projects/creator.gameproject'],
      farm:    ['--project', 'projects/farm.gameproject'],
      // The Studio, browser-rendered from the same manifest.
      shell:  ['--shell',  'projects/creator.gameproject'],
      demo:   []
    };
    // A GAME is named by its manifest, not by an entry in the table above. `?project=`
    // passes the path straight through to --project, so adding a game needs no edit
    // here — the same reason main.cpp has one entries() table rather than a chain of
    // ifs. The named modes stay for the dev scenes that have no manifest.
    var params  = new URLSearchParams(location.search);
    var project = params.get('project');
    var shellOf = params.get('shell');
    var mode    = params.get('mode') || 'gui';
    if (project) argsByMode[mode = '_project'] = ['--project', project];
    if (shellOf) argsByMode[mode = '_shell']   = ['--shell', shellOf];
    // ?mode=lab-<id> reaches any lab without this file listing them. Twelve named
    // modes used to sit here, one per flag, and they went stale the moment main.cpp
    // changed — the page should not be a second copy of the lab table.
    if (mode.indexOf('lab-') === 0) argsByMode[mode] = ['--lab', mode.slice(4)];
    // ?cmd=<id>&args=<space separated> runs a HEADLESS command and exits — no window,
    // no scene. It exists so the claim "this computes the same thing everywhere" can be
    // checked ON THE TARGET THIS PROJECT ACTUALLY SHIPS ON. `creature.verify` re-plays a
    // battle recorded by a native build and compares the hash after every turn; until
    // this line the WebAssembly build had never re-computed anything a native build had
    // computed, so "deterministic across machines" stopped at the two that run CI.
    var cmdId = params.get('cmd');
    if (cmdId) argsByMode[mode = '_cmd'] = ['--cmd', cmdId].concat((params.get('args') || '').split(' ').filter(Boolean));
    var projectNames = {
      creator: 'Creator', colony: 'Colony', creatures: 'Creatures', farm: 'Farm', iso: 'Iso Farm'
    };
    function projectStem(path) {
      var match = /(?:^|\/)([^/]+)\.gameproject$/.exec(path || '');
      return match ? match[1] : '';
    }
    var stem = projectStem(project || shellOf);
    titleEl.textContent = projectNames[stem] || (cmdId ? 'Command' : mode === 'gui' ? 'Chess' : 'Engine Lab');
    document.body.dataset.game = stem || mode;
    document.title = titleEl.textContent + ' — Hand Engine';

    // Clicking or touching the game must also return focus to it: touching the page
    // chrome moves focus away, and SDL2's Emscripten backend delivers keys to the
    // CANVAS — so the keyboard goes quiet with nothing on screen to say why (ch. 123).
    // Keep the canvas's DISPLAY size in step with its DRAWING size.
    //
    // Emscripten sets `canvas.style.width/height` itself, in CSS pixels, to the size SDL
    // asked for. Once those inline styles exist, `max-width: 100%` and `max-height: 100%`
    // clamp the two axes INDEPENDENTLY — the intrinsic-ratio rules that make a plain
    // <canvas> shrink proportionally no longer apply. On a 390px-wide phone that made a
    // 1280x720 game 390x720: every assertion passed, touch landed on the right tile
    // (SDL maps through the same box), and the picture was stretched to two and a half
    // times its height. Only a screenshot said so.
    function fit() {
      var box = stageEl.getBoundingClientRect();
      var w = canvasEl.width, h = canvasEl.height;      // the drawing buffer IS the ratio
      if (!w || !h || !box.width || !box.height) return;
      var k = Math.min(box.width / w, box.height / h);
      canvasEl.style.width  = Math.max(1, Math.floor(w * k)) + 'px';
      canvasEl.style.height = Math.max(1, Math.floor(h * k)) + 'px';
      // A 16:9 game on a 9:19.5 phone is a stamp in portrait. Say so, once, in the bar —
      // rather than stretching the picture to fill a shape the game does not have.
      var portrait = box.height > box.width && w > h;
      hintEl.textContent = portrait ? 'rotate for a bigger picture' : '';
    }
    // The stage changes with the window; the drawing buffer changes when SDL sets it,
    // which happens after this script runs and again on any resize the app asks for.
    new ResizeObserver(fit).observe(stageEl);
    new MutationObserver(fit).observe(canvasEl, { attributes: true,
                                                  attributeFilter: ['width', 'height'] });
    addEventListener('resize', fit);

    var refocus = function () { canvasEl.focus(); };
    canvasEl.addEventListener('mousedown', refocus);
    canvasEl.addEventListener('touchstart', refocus, { passive: true });

    document.getElementById('logbtn').addEventListener('click', function () {
      document.body.classList.toggle('logging');
      refocus();
    });
    document.getElementById('fsbtn').addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (stageEl.requestFullscreen) stageEl.requestFullscreen({ navigationUI: 'hide' });
      // Fullscreen moves focus to the fullscreen element; the game needs it back.
      setTimeout(refocus, 50);
    });

    var Module = {
      arguments: argsByMode[mode] || argsByMode.gui,
      // The preloaded asset tree is MEMFS: it lives in this tab and dies with it. That
      // is right for the game's content (it ships inside demo.data) and wrong for the
      // one directory that is the player's — saves, the sync bookmark, the device id.
      // Mount that on IDBFS and read the browser's copy BEFORE main runs.
      //
      // addRunDependency is the supported way to make an async step block startup.
      // Without it main() would start against an empty directory, conclude there is no
      // save, and the real one would arrive a moment later with nothing looking at it.
      preRun: [function () {
        try {
          FS.mkdirTree('/assets/saves');
          FS.mount(IDBFS, {}, '/assets/saves');
          addRunDependency('idbfs');
          FS.syncfs(true, function (err) {
            if (err) console.error('idbfs load failed: ' + err);
            removeRunDependency('idbfs');
          });
        } catch (e) {
          // No IDBFS (private mode, storage blocked) is not a reason not to play. The
          // game runs; it just forgets. Saying so beats a save that silently vanishes.
          console.error('persistent storage unavailable: ' + e);
          statusEl.textContent = 'running (saves will not persist)';
        }
      }],
      canvas: canvasEl,
      setStatus: function (t) { if (t) statusEl.textContent = t; },
      print:    function (t) { logEl.textContent += t + "\n"; logEl.scrollTop = logEl.scrollHeight; },
      printErr: function (t) { logEl.textContent += t + "\n"; },
      onRuntimeInitialized: function () {
        statusEl.textContent = 'running';
        fit();                       // SDL has set the drawing buffer by now
        // FOCUS THE CANVAS. SDL2's Emscripten backend listens for key events on the
        // canvas element, so with focus anywhere else (the body, by default) the build
        // receives no keyboard input AT ALL — no WASD, no Cmd+S, no tool shortcuts.
        // That was true of every web build from chapter 118 until chapter 123, and it
        // went unnoticed because every browser check so far had used the mouse.
        // tabindex="0" above is the other half: an element that cannot be focused
        // cannot be given focus.
        canvasEl.focus();
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
